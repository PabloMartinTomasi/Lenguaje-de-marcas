<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mostrar JSON</title>
  <style>
    table {
      width: 50%;
      border-collapse: collapse;
      margin: 20px auto;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #f4f4f4;
    }
    .imagen{
      text-align: center;
    }
  </style>
</head>
<body>
  <h1 style="text-align:center;">Datos desde JSON</h1>

  <!--Filtros-->
  <div style="text-align: center;">
    <input type="text" id="nameFilter" placeholder="Nombre" oninput="filterData()">
  </div>

  <!--Tabla-->
  <div id="data-container" style="text-align:center;">
    <table border="3">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Fundacion</th>
          <th>Europeo</th>
          <th>Pais</th>
          <th>Estadio</th>
        </tr>
      </thead>
      <tbody id="data-table-body">
        <!-- Los datos se cargarán aquí -->
      </tbody>
    </table>
  </div>
  <script src="script.js"></script>
  <div class="imagen">
    <img src="DonDanielCarvajal.jpg">
  </div>
</body>
</html>
