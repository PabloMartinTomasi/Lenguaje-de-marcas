<script>
    async function ElTiempo() {
        const response = await fetch('https://www.el-tiempo.net/api/json/v2/provincias/28/municipios');
        if (response.ok){
            const data = await response.json();
            console.log("datos obtenidos", data);
            console.log("Titulo", data.title);
            console.log("Hoy", data.today.p);
        } else{
            console.log('Error en el fetch');
        }
    }
    // Ejemplo de uso
    ElTiempo();
</script>
