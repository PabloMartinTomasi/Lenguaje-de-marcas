<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mostrar JSON</title>
  <style>
    table {
      width: 50%;
      border-collapse: collapse;
      margin: 20px auto;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #f4f4f4;
    }
  </style>
</head>
<body>
  <h1 style="text-align:center;">Datos desde JSON</h1>
  
  <!-- Filtros -->
  <div style="text-align:center; margin-bottom: 20px;">
    <input type="text" id="nameFilter" placeholder="Filtrar por nombre" oninput="filterData()">
    
  </div>

  <div id="data-container" style="text-align:center;">
    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Autor</th>
          <th>Capítulos</th>
          <th>Traducido</th>
          <th>Personajes</th>
        </tr>
      </thead>
      <tbody id="data-table-body">
        <!-- Los datos se cargarán aquí -->
      </tbody>
    </table>
  </div>

  <script src="script2.js"></script>
</body>

</html>
