    <style>
        body {
            background-image: url('https://www.fundacionaquae.org/wp-content/uploads/2019/02/nubes-y-cambio-climatico-1024x576.jpg');
            background-size: cover;
        }
    </style>

    <title>Tiempo</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-secondary">
        <a class="navbar-brand" href="#">Mi Sitio</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item active">
                    <a class="nav-link" href="index.html">Inicio</span></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="tiempo.html">Tiempo <span class="sr-only"></span></a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container mt-5">
        <form id="dataSelectionForm">
            <div class="form-group">
                <label for="indexSelect">Selecciona una Ciudad:</label>
                <select class="form-control" id="indexSelect">
                    <option value="all">Todas las ciudades</option>
                </select>
            </div>

            <div class="form-group">
                <label for="minTemp">Temperatura Mínima (°C):</label>
                <input type="number" id="minTemp" class="form-control" placeholder="Temperatura mínima">
            </div>
            <div class="form-group">
                <label for="maxTemp">Temperatura Máxima (°C):</label>
                <input type="number" id="maxTemp" class="form-control" placeholder="Temperatura máxima">
            </div>

            <div class="form-group">
                <label for="weatherState">Estado del Cielo:</label>
                <select id="weatherState" class="form-control">
                    <option value="all">Todos</option>
                </select>
            </div>
        </form>

        <table id="weather-table" class="table">
            <thead>
                <tr>
                    <th>Ciudad</th>
                    <th>Provincia</th>
                    <th>Descripción del Clima</th>
                    <th>Temperatura Máxima (°C)</th>
                    <th>Temperatura Mínima (°C)</th>
                </tr>
            </thead>
            <tbody id="weather-data">
            </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>

</html>
